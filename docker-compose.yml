version: '3'

services:
  mongodb:
    image: mongo:latest
    container_name: fsae-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: fsae2026
      MONGO_INITDB_DATABASE: fsae_db
    volumes:
      - ./mongodb_data:/data/db
